# MinIO (S3) — o navegador envia e baixa arquivos direto daqui, por URL
# pré-assinada gerada pela API com S3_PUBLIC_ENDPOINT. Atende prod e staging
# (buckets diferentes).
server {
    # arquivos.gestaoexcellence.com.br (o certbot acrescenta o 443). A porta 8202 segue
    # atendendo pelo IP até a virada para HTTPS (S3_PUBLIC_ENDPOINT).
    listen 80;
    listen [::]:80;
    listen 8202;
    listen [::]:8202;
    server_name arquivos.gestaoexcellence.com.br;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        # A assinatura da URL inclui o Host (com a porta): precisa chegar igual ao
        # público. $host perde a porta, por isso $http_host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }
}
