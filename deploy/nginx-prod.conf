server {
    # Sem DNS por enquanto: acesso por http://IP:8200. Com domínio, volta pra
    # "listen 80" + server_name e certbot.
    listen 8200;
    listen [::]:8200;
    server_name _;

    # Web: SPA estática (Vite) da release ativa.
    root /var/www/projetos/repo/excellence/prod/current/web;
    index index.html;

    client_max_body_size 20m;

    # API (NestJS via PM2, porta 3200 só em localhost). Sem URI no proxy_pass:
    # repassa o caminho inteiro (/api/v1/...), que é o prefixo do Nest.
    location /api/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PWA: service worker, manifest e index nunca em cache, senão o app não atualiza.
    location ~ ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Arquivos com hash no nome.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
