name: Criar usuários

# Cria contas da gestão (Administrador, RH, Gestor) numa empresa existente
# (apps/api/scripts/create-users.ts). As senhas temporárias aparecem no log do passo
# "Criar contas" (troca obrigatória no primeiro acesso). Rodar de novo não duplica nem troca
# senha. Ver deploy/README.md.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente
        type: choice
        options: [production, staging]
        default: production
      users:
        description: 'Contas: Nome|e-mail|Perfil; Nome|e-mail|Perfil (Perfil: Administrador, RH ou Gestor)'
        required: true
      company_cnpj:
        description: CNPJ da empresa (vazio = a única empresa do banco)
        required: false

concurrency:
  group: create-users-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Preparar (shared e client do Prisma)
        run: |
          pnpm turbo run build --filter=@excellence/shared
          pnpm --filter @excellence/api db:generate

      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Adicionar VPS aos known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_SSH_PORT || 22 }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Criar contas (via túnel SSH)
        env:
          SSH_PORT: ${{ secrets.VPS_SSH_PORT || 22 }}
          DATABASE_URL: ${{ inputs.environment == 'production' && secrets.DATABASE_URL_PROD || secrets.DATABASE_URL_STAGING }}
          CREATE_USERS: ${{ inputs.users }}
          COMPANY_CNPJ: ${{ inputs.company_cnpj }}
        run: |
          ssh -p "$SSH_PORT" -fN -o ExitOnForwardFailure=yes \
            -L 127.0.0.1:5432:127.0.0.1:5432 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          pnpm --filter @excellence/api exec tsx scripts/create-users.ts
