packages:
  - apps/api
  - apps/web
  - packages/*
allowBuilds:
  '@swc/core': true
  esbuild: true
  '@prisma/engines': true
  prisma: true
  # Telemetria (via @nestjs/swagger): não executar.
  '@scarf/scarf': false
  # Binários nativos opcionais do ssh2 (testcontainers): o fallback em JS basta.
  cpu-features: false
  ssh2: false
  protobufjs: false
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1140.0'
  - nestjs-pino@5.2.1
